spring.application.name=mirana

server.port=${PORT:8080}
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

spring.datasource.url=${MIRANA_DB_URL:jdbc:mysql://localhost:3306/mirana?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${MIRANA_DB_USER:root}
spring.datasource.password=${MIRANA_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Sessions live in MySQL so they survive Render restarts. Schema comes from Flyway (V2).
spring.session.jdbc.initialize-schema=never
spring.session.timeout=14d
server.servlet.session.cookie.name=MIRANA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MIRANA_SECURE_COOKIES:false}

# Mail: Mailpit locally. Production uses any SMTP provider through these env vars.
spring.mail.host=${MIRANA_MAIL_HOST:localhost}
spring.mail.port=${MIRANA_MAIL_PORT:1025}
spring.mail.username=${MIRANA_MAIL_USER:}
spring.mail.password=${MIRANA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MIRANA_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MIRANA_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

mirana.auth.otp-secret=${MIRANA_OTP_SECRET:dev-only-change-me-dev-only-change-me}
mirana.auth.check-mx=${MIRANA_CHECK_MX:true}
mirana.auth.breach-check=${MIRANA_BREACH_CHECK:true}
mirana.auth.secure-cookies=${MIRANA_SECURE_COOKIES:false}
mirana.auth.mail-from=${MIRANA_MAIL_FROM:Mirana <no-reply@mirana.local>}
mirana.auth.app-url=${MIRANA_APP_URL:http://localhost:5173}
# Local dev only: print OTP codes in the API log. Never enable in production.
mirana.auth.log-otp=${MIRANA_LOG_OTP:false}
mirana.seed-email=${MIRANA_SEED_EMAIL:}

# GitHub App webhook. Empty means the endpoint refuses every delivery.
mirana.github.webhook-secret=${MIRANA_GITHUB_WEBHOOK_SECRET:}

# GitHub App connect flow (Settings, GitHub). Leave empty to hide it. The private key is the PEM text, "\n" allowed.
mirana.github.app-id=${MIRANA_GITHUB_APP_ID:}
mirana.github.app-slug=${MIRANA_GITHUB_APP_SLUG:}
mirana.github.client-id=${MIRANA_GITHUB_CLIENT_ID:}
mirana.github.client-secret=${MIRANA_GITHUB_CLIENT_SECRET:}
mirana.github.private-key=${MIRANA_GITHUB_PRIVATE_KEY:}
